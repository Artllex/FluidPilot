<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FluidPilot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon-48.png" width="48" height="48" alt="">
    <div>
      <h1>FluidPilot</h1>
      <p data-i18n="popupSubtitle"></p>
    </div>
  </header>
  <p class="status" data-i18n="popupStatus"></p>
  <dl>
    <div><dt>L</dt><dd data-i18n="shortcutLoop"></dd></div>
    <div><dt>Z / X + ← →</dt><dd data-i18n="shortcutEdges"></dd></div>
    <div><dt>G</dt><dd data-i18n="shortcutGif"></dd></div>
    <div><dt>F</dt><dd data-i18n="shortcutVideo"></dd></div>
    <div><dt>P</dt><dd data-i18n="shortcutVolume"></dd></div>
  </dl>
  <p class="hint" data-i18n="popupHint"></p>
  <script src="popup.js"></script>
</body>
</html>
